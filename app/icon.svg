<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Subtle warm ambient light bleeding from the dot onto the background -->
    <radialGradient id="warm-bg" cx="78%" cy="78%" r="65%">
      <stop offset="0%" stop-color="#FF4400" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer soft glow ring -->
    <radialGradient id="glow-outer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4400" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner tight glow -->
    <radialGradient id="glow-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6633" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0d0d14"/>
  <!-- Warm ambient from the dot -->
  <rect width="32" height="32" rx="7" fill="url(#warm-bg)"/>

  <!-- "b" letterform -->
  <!-- Bowl outer — center (15,19) r=7, slightly overlaps stem for clean join -->
  <circle cx="15" cy="19" r="7" fill="white"/>
  <!-- Bowl counter / inner hole -->
  <circle cx="15" cy="19" r="3.4" fill="#0d0d14"/>
  <!-- Left mask: removes bowl behind the stem area -->
  <rect x="0" y="12" width="9" height="14" fill="#0d0d14"/>
  <!-- Stem — drawn last so it sits on top clean -->
  <rect x="5" y="5" width="4" height="21" rx="2" fill="white"/>

  <!-- Orange period dot — the brandmark "." from "benard." -->
  <!-- Outermost soft halo -->
  <circle cx="25" cy="25" r="7.5" fill="url(#glow-outer)"/>
  <!-- Mid glow ring -->
  <circle cx="25" cy="25" r="4.5" fill="url(#glow-inner)"/>
  <!-- Solid core -->
  <circle cx="25" cy="25" r="2.6" fill="#FF4400"/>
  <!-- Specular highlight — top-left bright catch light -->
  <circle cx="24.1" cy="24.1" r="0.85" fill="#FF8855" fill-opacity="0.85"/>
</svg>
